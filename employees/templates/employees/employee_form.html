
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 7px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input[type="checkbox"] {
            width: auto;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .error { color: #dc2626; }
        .messages { color: #15803d; }
    </style>
</head>
<body>
<div class="container">
    <h2>{{ title }}</h2>

    {% for message in messages %}
        <p class="messages">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <p>
                <label><strong>{{ field.label }}</strong></label><br>
                {{ field }}

                {% for error in field.errors %}
                    <span class="error">{{ error }}</span>
                {% endfor %}
            </p>
        {% endfor %}

        <button type="submit">Save Employee</button>
        <a href="{% url 'employee_list' %}">Cancel</a>
    </form>
</div>
</body>
</html>
